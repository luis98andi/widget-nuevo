<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8Gadget Voice</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        background: rgba(15, 23, 42, 0.8);
        color: #e2e8f0;
        font-family: Arial, Helvetica, sans-serif;
      }
      .widget {
        width: 280px;
        min-height: 180px;
        padding: 14px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.3);
        box-shadow: 0 18px 35px rgba(15, 23, 42, 0.35);
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.15);
        color: #93c5fd;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 10px 0 12px;
        font-size: 22px;
      }
      textarea {
        width: 100%;
        min-height: 80px;
        resize: vertical;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.35);
        color: #f8fafc;
        border-radius: 8px;
        padding: 10px;
        font: inherit;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: white;
        font-weight: 700;
        padding: 8px 10px;
        cursor: pointer;
      }
      .status {
        margin-top: 12px;
        font-size: 11px;
        color: #bfdbfe;
      }
    </style>
  </head>
  <body>
    <div class="widget">
      <div class="badge">8Gadget</div>
      <h1>Voz</h1>
      <textarea id="texto" placeholder="Texto recibido..."></textarea>
      <div class="actions">
        <button id="leerBtn">Leer</button>
      </div>
      <div id="status" class="status">Esperando mensajes.</div>
    </div>

    <script src="js/gadget.js"></script>
  </body>
</html>
